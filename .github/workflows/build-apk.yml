name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1
          EXPO_PUBLIC_APP_ID: "ZqLP4Hp4heLnQ5Qv8pMj5b"
          EXPO_PUBLIC_OAUTH_PORTAL_URL: "https://manus.im"
          EXPO_PUBLIC_OAUTH_SERVER_URL: "https://api.manus.im"
          EXPO_PUBLIC_OWNER_OPEN_ID: "NzzzKHspJv2F57DD8S7yXr"
          EXPO_PUBLIC_OWNER_NAME: "Moustafa mohamed"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📱 Build Android Release APK (Standalone with embedded bundle)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🔍 Locate and rename generated APK
        id: find_apk
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found raw APK at: $RAW_APK"
          cp "$RAW_APK" "./ain-al-tajir-v1.0.4.apk"
          echo "apk_path=./ain-al-tajir-v1.0.4.apk" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ain-al-tajir-v1.0.4
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "عين التاجر v1.0.4 (تسجيل ودخول محلي مستقل دون تحويل خارجي)"
          body: |
            تحديث رئيسي للاستقلالية الكاملة عن أي منصة خارجية:
            - إلغاء التحويل الخارجي لـ Manus OAuth بالكامل عند الدخول أو التسجيل.
            - تسجيل فوري ومباشر للتجربة المجانية لمدة 7 أيام داخل التطبيق مباشرة.
            - إضافة زر الدخول السريع للنسخة التجريبية (Demo Mode) بضغطة زر واحدة.
            - دعم العمل دون الحاجة لخادم سحابي عبر تفعيل صلاحيات الاستخدام والتجربة محلياً.
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
