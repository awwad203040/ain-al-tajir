name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1
          EXPO_PUBLIC_APP_ID: "ZqLP4Hp4heLnQ5Qv8pMj5b"
          EXPO_PUBLIC_OAUTH_PORTAL_URL: "https://manus.im"
          EXPO_PUBLIC_OAUTH_SERVER_URL: "https://api.manus.im"
          EXPO_PUBLIC_OWNER_OPEN_ID: "NzzzKHspJv2F57DD8S7yXr"
          EXPO_PUBLIC_OWNER_NAME: "Moustafa mohamed"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📱 Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🔍 Locate generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ain-al-tajir-app-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "عين التاجر v1.0.1 (APK)"
          body: "النسخة المحدثة لتطبيق عين التاجر — تم حل مشكلة توقف الشعار وتفعيل الفتح التلقائي السلس"
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
